name: Flask CI/CD

on:
  push:
    branches:
      - Prod  # Change this to your main branch name

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10.6'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest test/test_app.py

  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/Prod' && github.event_name == 'push' && github.event.pull_request == null && success()

    steps:
      - name: Skip deployment when using Heroku
        run: echo "Skipping deployment as Heroku handles it automatically."
