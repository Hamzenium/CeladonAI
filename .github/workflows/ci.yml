name: Flask CI/CD

on:
  push:
    branches:
      - Prod

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10.6'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up virtual environment
        run: python -m venv venv

      - name: Activate virtual environment and install dependencies
        run: |
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Run tests
        run: |
          source venv/bin/activate
          python -m pytest test/test_app.py

  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/Prod' && github.event_name == 'push' && github.event.pull_request == null && success()

    steps:
      - name: Skip deployment when using Heroku
        run: echo "Skipping deployment as Heroku handles it automatically."
